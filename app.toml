# How to enlace semix.
#
# This file describes how to serve the app, not where to deploy it.
# The deployment platform decides URL prefix and build env; semix itself
# knows nothing about either.
#
# Standard enlace keys. enlace finds `server.py` at the repo root by
# convention and uses its `app` attribute, so those aren't spelled out.
frontend_dir = "webapp/ui/dist"

# tw_platform extension (not part of enlace): pip-install this app's source
# tree into the server venv so server.py can `from semix import ...`.
install_as_package = true

# Proposed, not yet part of enlace: a [build] section describing how to
# produce the frontend from source. Deployment tools (e.g. tw_platform)
# read this today; enlace may adopt it later. See enlace issue on
# build-step support.
#
#   cwd       — directory to run the commands from (relative to this file)
#   install   — optional: a dependency-install step (idempotent)
#   build     — the build command
#   env_vars  — env vars the build honours; platform deployer injects values
[build]
cwd      = "webapp/ui"
install  = ["npm", "install", "--no-audit", "--no-fund", "--no-progress"]
build    = ["npm", "run", "build"]
env_vars = ["VITE_API_BASE", "VITE_PUBLIC_BASE"]
